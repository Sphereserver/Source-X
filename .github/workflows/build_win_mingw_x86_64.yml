name: Windows x86_64 (MinGW)

# Checks that the server builds with MinGW-w64 GCC (MSYS2 UCRT64). It doesn't package nor publish the build.

on:
  push:
      paths-ignore:
        - '.gitignore'
        - '.gitattributes'
        - '**.md'
        - 'Changelog.txt'
  pull_request:
    branches:
      - 'master'
      - 'main'
      - 'dev'

permissions:
  contents: read

jobs:
  windows-mingw-x86_64:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Install MSYS2 and the MinGW-w64 toolchain
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          git
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja

    - name: CMake
      run: |
            cmake -G "Ninja" -DCMAKE_BUILD_TYPE="Nightly" \
              -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/Windows-GNU-x86_64.cmake \
              -S ./ -B ./build
    - name: Build
      run: ninja -C build -k 0   # report every file that fails to compile
